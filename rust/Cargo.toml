[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3.32"
proc-macro2 = "1.0.106"
quote = "1.0.46"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.118", features = ["full", "visit"] }
tokio = { version = "1.52.3", features = ["full"] }
